[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-intrusion-system"
version = "0.1.0"
description = "Modular Network Intrusion Detection System (NIDS) for UNSW-NB15 traffic classification and risk scoring."
readme = "README.md"
authors = [{ name = "Lokesh Deshwal" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
